<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="MAIA">
  <!-- Logo para la pantalla de acceso de Cloudflare.
       Va sobre baldosa oscura propia para que se lea bien sea cual sea el
       fondo que ponga Cloudflare. Sin tipografia: la letra dependeria de una
       fuente que esa pagina no carga. -->
  <rect width="160" height="160" rx="36" fill="#17181A"/>
  <g transform="translate(28 28) scale(1.04)">
    <g stroke="#FFFEFB" stroke-width="5.5" fill="none">
      <line x1="50" y1="26" x2="26" y2="70"/><line x1="50" y1="26" x2="74" y2="70"/><line x1="26" y1="70" x2="74" y2="70"/>
    </g>
    <circle cx="50" cy="26" r="11.5" fill="#FFFEFB"/>
    <circle cx="26" cy="70" r="11.5" fill="#FFFEFB"/>
    <!-- Tercer nodo azul: el nodo sin asignar de la marca madre. -->
    <circle cx="74.5" cy="70.5" r="14.5" fill="#6E9BF0"/>
  </g>
</svg>
